[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lda"
version = "0.1.0"
description = "Lift-door agentic pipeline core"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest"]
encoder = ["torch==2.14.1", "timm==1.0.30", "einops==0.8.2"]

[tool.setuptools]
packages = ["lda_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: runs heavy model or encoder tests",
    "perm: tests real filesystem permission behavior; skip as root",
]
